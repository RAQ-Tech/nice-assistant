# The fast gate for pull requests - dependabot's, mostly.
#
# Everything in the verifier except the Playwright journeys, which need a
# browser download and account for most of the full gate's cost. A pull request
# merged on this gate still cannot reach production unverified: publishing
# happens only from a main run of the full gate in publish-ghcr.yml.

name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The image is what ships, so its FROM lines are the one place these
      # versions are written: a Dependabot base-image bump moves CI with it.
      - name: Read runtime versions from the Dockerfile
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python=$(sed -nE 's/^FROM python:([0-9]+(\.[0-9]+)*).*/\1/p' Dockerfile)
          node=$(sed -nE 's/^FROM node:([0-9]+(\.[0-9]+)*).*/\1/p' Dockerfile)
          if [[ ! "$python" =~ ^[0-9]+(\.[0-9]+)+$ || ! "$node" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            echo "::error file=Dockerfile::expected one python and one node FROM line with a numeric tag"
            exit 1
          fi
          echo "Python $python and Node.js $node, from the Dockerfile"
          echo "python=$python" >> "$GITHUB_OUTPUT"
          echo "node=$node" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ steps.runtime.outputs.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.runtime.outputs.node }}
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -e '.[dev]'

      - name: Run verification without browser journeys
        run: python scripts/verify.py --skip-browser-e2e
