# The fast gate for pull requests - dependabot's, mostly.
#
# Everything in the verifier except the Playwright journeys, which need a
# browser download and account for most of the full gate's cost. A pull request
# merged on this gate still cannot reach production unverified: publishing
# happens only from a main run of the full gate in publish-ghcr.yml.

name: Checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -e '.[dev]'

      - name: Run verification without browser journeys
        run: python scripts/verify.py --skip-browser-e2e
