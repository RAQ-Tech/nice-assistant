# The production gate and the publish, and nothing else.
#
# This used to run on every push to every branch, had no timeout - one hung run
# sat for six hours, GitHub's default cap - and let a superseded run finish a
# build nobody would pull. Of the last hundred runs, over half the compute went
# to those two failure modes rather than to gating anything.
#
# Now: main and release tags only, a timeout a hang actually hits, the newest
# push cancels the one it superseded, and the installs that never change
# between runs come from cache. Pull requests get the fast gate in checks.yml;
# an image still publishes only from a main run that passed the full
# verification, so the production gate is exactly what it was.

name: Publish container image

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # One run per ref: a newer push to main makes the older run's image nobody's,
  # so finishing it is pure spend. Tag builds get their own group per tag.
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Verification takes eight to ten minutes; a run past this is stuck, not
    # slow, and the default cap it would otherwise run to is six hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install browser dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Install verification dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run repository verification
        run: python scripts/verify.py

  build-and-push:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive deterministic image metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nice-assistant"
          version="$GITHUB_REF_NAME"
          tags="${image}:sha-${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            version="main"
            tags+=$'\n'"${image}:main"
            tags+=$'\n'"${image}:latest"
          else
            tags+=$'\n'"${image}:${GITHUB_REF_NAME}"
          fi
          {
            echo 'tags<<EOF'
            echo "$tags"
            echo 'EOF'
            echo 'labels<<EOF'
            echo "org.opencontainers.image.created=$(date --utc +'%Y-%m-%dT%H:%M:%SZ')"
            echo "org.opencontainers.image.revision=${GITHUB_SHA}"
            echo "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
            echo "org.opencontainers.image.version=${version}"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Unchanged layers come from the cache of the previous build instead
          # of being rebuilt - most pushes change app code, not dependencies.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance stays on, and not for the attestation itself: with it,
          # the tag is published as an OCI index, which is the manifest shape
          # Unraid's update checker can compare digests against. Turning it
          # off flipped the tag to a bare manifest and the server's Docker
          # page went from "update ready" to "not available" - the registry
          # clutter it saves is not worth breaking update detection over.
