[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "nice-assistant"
version = "0.1.0"
description = "Private-LAN, voice-first assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.18.5",
  "cryptography==50.0.0",
  "fastapi==0.139.0",
  "Pillow==12.3.0",
  "python-multipart==0.0.31",
  "SQLAlchemy==2.0.51",
  "uvicorn==0.51.0",
]

[project.optional-dependencies]
dev = [
  "coverage==7.15.1",
  "httpx==0.28.1",
  "ruff==0.15.21",
]

[tool.setuptools.packages.find]
include = ["app*", "migrations*", "web*"]

[tool.setuptools.package-data]
web = ["*.css", "*.html", "*.js", "*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "C901"]

[tool.ruff.lint.mccabe]
# Cyclomatic complexity ceiling. The 13 functions already above this line carry an
# explicit `# noqa: C901`, so `ruff check` stays clean — this is a ratchet against new
# tangle, not a demand to refactor on the spot. Those noqa comments are the debt list;
# the worst is create_turn in app/conversation_service.py at 49.
max-complexity = 15

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = true
